name: Build JDC AX1800 Pro LiBwrt
run-name: core · JDC AX1800 Pro · LiBwrt 25.12-nss

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repo_commit:
        description: Lock upstream to a full 40-character commit SHA (leave empty for latest)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  REPO_COMMIT: ${{ inputs.repo_commit }}
  TZ: Asia/Shanghai

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      file_date: ${{ steps.release_date.outputs.file_date }}
      release_tag: ${{ steps.release_date.outputs.release_tag }}

    steps:
      - name: Generate release date
        id: release_date
        run: |
          FILE_DATE="$(date '+%Y.%m.%d')"
          echo "file_date=${FILE_DATE}" | tee -a "$GITHUB_OUTPUT"
          echo "release_tag=v${FILE_DATE}" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.variant }} firmware
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ["core"]
    env:
      FILE_DATE: ${{ needs.metadata.outputs.file_date }}

    steps:
      - name: Check server
        run: |
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          echo "Cores: $(nproc)"
          free -h
          df -hT

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh -o /tmp/init_build_environment.sh
          echo "85f4b2c2aa16f8178b57250f5d2bcf4a2e0707c6b569a3b07510f41fc6185dd8  /tmp/init_build_environment.sh" > /tmp/init_build_environment.sh.sha256
          sha256sum -c /tmp/init_build_environment.sh.sha256
          sudo bash /tmp/init_build_environment.sh
          rm -f /tmp/init_build_environment.sh /tmp/init_build_environment.sh.sha256
          sudo -E apt -yqq install clang llvm dos2unix libfuse-dev
          for tool in clang llc llvm-dis opt llvm-strip; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              candidate="$(ls /usr/bin/${tool}-* 2>/dev/null | sort -V | tail -n 1 || true)"
              if [ -n "$candidate" ]; then
                sudo ln -sf "$candidate" "/usr/local/bin/$tool"
              fi
            fi
            command -v "$tool"
          done
          clang --version | head -n 1
          llc --version | head -n 1
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          swap-size-mb: 1024
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Validate scripts and NSS verifier tests
        run: |
          bash -n scripts/diy.sh scripts/update-feeds.sh scripts/verify-ipq6018-nss-region.sh
          sh -n files/usr/sbin/jdc-healthcheck
          bash tests/test-verify-ipq6018-nss-region.sh
          python3 tests/test-remove-default-luci.py

      - name: Clone source
        id: clone_source
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          if [ -n "$REPO_COMMIT" ]; then
            if [[ ! "$REPO_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::repo_commit must be a full 40-character hexadecimal commit SHA" >&2
              exit 2
            fi
            cd openwrt
            git fetch --depth=1 origin "$REPO_COMMIT"
            git -c advice.detachedHead=false checkout FETCH_HEAD
            resolved_commit="$(git rev-parse HEAD)"
            requested_commit="$(printf '%s' "$REPO_COMMIT" | tr 'A-F' 'a-f')"
            if [ "$resolved_commit" != "$requested_commit" ]; then
              echo "::error::checked-out source does not match repo_commit" >&2
              exit 2
            fi
            cd "$OLDPWD"
          fi
          cd openwrt
          echo "OPENWRT_PATH=$PWD" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          {
            echo "VERSION_INFO<<EOF"
            git show -s --date=short --format='Author: %an%nDate: %cd%nSubject: %s%nHash: %H'
            echo "EOF"
          } | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"

      - name: Generate version
        id: version
        run: |
          chmod +x scripts/version.sh
          bash scripts/version.sh

      - name: Load config and detect target
        id: detect_target
        run: |
          cp configs/core.config openwrt/.config
          cd openwrt
          unset VERSION
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y$' .config \
            && echo "Target device verified: jdcloud_re-ss-01"
          source_repo="${REPO_URL##*/}"
          {
            echo "SOURCE_REPO=${source_repo%.git}"
            echo "DEVICE_TARGET=$(awk -F'"' '/CONFIG_TARGET_BOARD/{print $2}' .config)"
            echo "DEVICE_SUBTARGET=$(awk -F'"' '/CONFIG_TARGET_SUBTARGET/{print $2}' .config)"
            kernel_version="$(grep -E '^KERNEL_PATCHVER:=' target/linux/qualcommax/Makefile 2>/dev/null | sed 's/.*:=//;s/^[[:space:]]*//')"
            echo "VERSION_KERNEL=${kernel_version:-6.12}"
          } | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"

      - name: Cache dl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.clone_source.outputs.OPENWRT_PATH }}/dl
          key: openwrt-dl-jdc-ax1800-pro-libwrt-${{ steps.detect_target.outputs.DEVICE_TARGET }}-${{ steps.detect_target.outputs.DEVICE_SUBTARGET }}

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.clone_source.outputs.OPENWRT_PATH }}/.ccache
          key: openwrt-ccache-${{ matrix.variant }}-${{ steps.detect_target.outputs.DEVICE_TARGET }}-${{ steps.detect_target.outputs.DEVICE_SUBTARGET }}-${{ steps.clone_source.outputs.SOURCE_COMMIT }}-${{ hashFiles('configs/*.config', 'scripts/diy.sh', 'scripts/version.sh', 'files/**', 'files-homeproxy/**') }}
          restore-keys: |
            openwrt-ccache-${{ matrix.variant }}-${{ steps.detect_target.outputs.DEVICE_TARGET }}-${{ steps.detect_target.outputs.DEVICE_SUBTARGET }}-${{ steps.clone_source.outputs.SOURCE_COMMIT }}-
            openwrt-ccache-${{ matrix.variant }}-${{ steps.detect_target.outputs.DEVICE_TARGET }}-${{ steps.detect_target.outputs.DEVICE_SUBTARGET }}-

      - name: Install feeds
        run: |
          cd "$OPENWRT_PATH"
          chmod +x $GITHUB_WORKSPACE/scripts/update-feeds.sh
          $GITHUB_WORKSPACE/scripts/update-feeds.sh

      - name: Apply custom files and scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OPENWRT_PATH/files"
          [ -d files ] && cp -a files/. "$OPENWRT_PATH/files/"
          [ -d files-homeproxy ] && cp -a files-homeproxy/. "$OPENWRT_PATH/files/"
          dos2unix scripts/diy.sh
          chmod +x scripts/diy.sh
          cd "$OPENWRT_PATH"
          cp "$GITHUB_WORKSPACE/configs/core.config" .config
          "$GITHUB_WORKSPACE/scripts/diy.sh" "${{ matrix.variant }}"

      - name: Download packages
        run: |
          cd "$OPENWRT_PATH"
          unset VERSION
          make defconfig
          require_config() {
            symbol="$1"
            if grep -q "^${symbol}=y$" .config; then
              echo "OK: ${symbol}=y"
              return 0
            fi
            echo "::error::Missing required config: ${symbol}=y" >&2
            grep -E "^(# )?${symbol}(=| is not set)" .config >&2 || true
            exit 1
          }
          forbid_config() {
            symbol="$1"
            if grep -Eq "^${symbol}=(y|m)$" .config; then
              echo "::error::Forbidden config is enabled: ${symbol}" >&2
              grep -E "^(# )?${symbol}(=| is not set)" .config >&2 || true
              exit 1
            fi
            echo "OK: ${symbol} is not enabled"
          }
          require_nss_firmware_version() {
            selected="$(awk -F= '/^CONFIG_NSS_FIRMWARE_VERSION_[0-9_]+=y$/ { print $1; exit }' .config)"
            if [ -n "$selected" ]; then
              echo "OK: ${selected}=y"
              echo "NSS_FIRMWARE_VERSION=${selected#CONFIG_NSS_FIRMWARE_VERSION_}" >> "$GITHUB_ENV"
              return 0
            fi
            echo "::error::No NSS firmware version was selected by upstream defconfig" >&2
            grep -Rho 'NSS_FIRMWARE_VERSION_[0-9_]*' package target 2>/dev/null | sort -u >&2 || true
            exit 1
          }
          version_ge() {
            awk -v have="$1" -v need="$2" '
              function splitver(v, a) {
                split(v, a, /[.+_-]/)
              }
              BEGIN {
                splitver(have, h)
                splitver(need, n)
                for (i = 1; i <= 4; i++) {
                  hv = (h[i] == "" ? 0 : h[i] + 0)
                  nv = (n[i] == "" ? 0 : n[i] + 0)
                  if (hv > nv) exit 0
                  if (hv < nv) exit 1
                }
                exit 0
              }
            '
          }
          require_recipe_patch() {
            image_mk="target/linux/qualcommax/image/ipq60xx.mk"
            dts="target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6000-re-ss-01.dts"
            target_mk="target/linux/qualcommax/Makefile"
            kernel_config="target/linux/qualcommax/config-${VERSION_KERNEL}"
            awk '
              /^define Device\/jdcloud_re-ss-01$/ { in_device = 1 }
              in_device && /KERNEL_SIZE := 12288k/ { kernel_ok = 1 }
              in_device && /SUPPORTED_DEVICES \+= jdcloud,ax1800-pro/ { compat_ok = 1 }
              in_device && /ipq-wifi-jdcloud_re-ss-01/ { wifi_package_present = 1 }
              in_device && /(^|[[:space:]])-luci([[:space:]]|$)/ { luci_collection_excluded = 1 }
              in_device && /IMAGE\/factory\.bin :=/ { factory_present = 1 }
              /^endef$/ && in_device { in_device = 0 }
              END { exit !(kernel_ok && compat_ok && luci_collection_excluded && !wifi_package_present && !factory_present) }
            ' "$image_mk" || {
              echo "::error::JDCloud AX1800 Pro image recipe patch is missing or incomplete" >&2
              sed -n '/define Device\/jdcloud_re-ss-01/,/endef/p' "$image_mk" >&2
              exit 1
            }
            for node in wifi q6v5_wcss q6_region q6_etr_region m3_dump_region; do
              awk -v node="&${node}" '
                $0 == node " {" { in_node = 1; next }
                in_node && /status = "disabled";/ { found = 1 }
                in_node && /^};$/ { in_node = 0 }
                END { exit !found }
              ' "$dts" || {
                echo "::error::JDCloud DTS node ${node} is not disabled" >&2
                exit 1
              }
            done
            ! grep -Fq 'kmod-qca-nss-drv-wifi-meshmgr' "$target_mk" || {
              echo "::error::NSS Wi-Fi mesh manager remains in target defaults" >&2
              exit 1
            }
            grep -Fq '#include "ipq6018-nss.dtsi"' "$dts" || {
              echo "::error::JDCloud DTS no longer includes the NSS device tree" >&2
              exit 1
            }
            "$GITHUB_WORKSPACE/scripts/verify-ipq6018-nss-region.sh" "target/linux/qualcommax/patches-${VERSION_KERNEL}"
            grep -qx '# CONFIG_QCOM_Q6V5_WCSS is not set' "$kernel_config" || {
              echo "::error::Q6V5 WCSS remoteproc remains enabled in the target kernel" >&2
              exit 1
            }
            echo "OK: JDCloud recipe and DTS are wired-only; Q6/WCSS reservations are disabled"
          }
          require_homeproxy_generator_patch() {
            generator="feeds/luci/applications/luci-app-homeproxy/root/etc/homeproxy/scripts/generate_client.uc"
            updater="feeds/luci/applications/luci-app-homeproxy/root/etc/homeproxy/scripts/update_subscriptions.uc"
            sing_box_version="${SING_BOX_VERSION:-}"
            test -f "$generator" || {
              echo "::error::HomeProxy client generator is missing" >&2
              exit 1
            }
            test -f "$updater" || {
              echo "::error::HomeProxy subscription updater is missing" >&2
              exit 1
            }
            if [ -z "$sing_box_version" ]; then
              sing_box_version="$(awk -F':=' '/^PKG_VERSION:=/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' feeds/packages/net/sing-box/Makefile 2>/dev/null || true)"
            fi
            test -n "$sing_box_version" || sing_box_version="0.0.0"
            ! grep -Fq "sniff_override_destination: strToBool(sniff_override)" "$generator" || {
              echo "::error::HomeProxy still contains legacy sing-box inbound sniff fields" >&2
              exit 1
            }
            ! grep -Fq "sniff: true" "$generator" || {
              echo "::error::HomeProxy still contains legacy inbound sniff=true fields" >&2
              exit 1
            }
            grep -Fq "inbound: ['mixed-in', 'redirect-in', 'tproxy-in', 'tun-in']" "$generator" || {
              echo "::error::HomeProxy sing-box 1.13 route sniff action is missing" >&2
              exit 1
            }
            grep -Fq "const main_urltest_nodes = filter(uci.get(uciconfig, ucimain, 'main_urltest_nodes')" "$generator" || {
              echo "::error::HomeProxy main urltest stale-node filter is missing" >&2
              exit 1
            }
            grep -Fq "const main_udp_urltest_nodes = filter(uci.get(uciconfig, ucimain, 'main_udp_urltest_nodes')" "$generator" || {
              echo "::error::HomeProxy UDP urltest stale-node filter is missing" >&2
              exit 1
            }
            grep -Fq "const cfg_urltest_nodes = filter(cfg.urltest_nodes || []" "$generator" || {
              echo "::error::HomeProxy custom urltest stale-node filter is missing" >&2
              exit 1
            }
            grep -Fq "if (isEmpty(urltest_node.type))" "$generator" || {
              echo "::error::HomeProxy stale urltest outbound skip is missing" >&2
              exit 1
            }
            if version_ge "$sing_box_version" "1.14.0"; then
              grep -Fq "default_http_client: 'direct-http'" "$generator" || {
                echo "::error::HomeProxy default HTTP client is missing for sing-box ${sing_box_version}" >&2
                exit 1
              }
              grep -Fq "config.http_clients = [" "$generator" || grep -Fq "http_clients: [" "$generator" || {
                echo "::error::HomeProxy direct HTTP client is missing for sing-box ${sing_box_version}" >&2
                exit 1
              }
              grep -Fq "tag: 'direct-http'" "$generator" || {
                echo "::error::HomeProxy direct HTTP client tag is missing for sing-box ${sing_box_version}" >&2
                exit 1
              }
              http_client_defs="$(awk 'index($0, "config.http_clients = [") || index($0, "http_clients: [") { count++ } END { print count + 0 }' "$generator")"
              test "$http_client_defs" -eq 1 || {
                echo "::error::Unexpected HomeProxy HTTP client definition count for sing-box ${sing_box_version}: ${http_client_defs}" >&2
                exit 1
              }
              http_clients="$(awk 'index($0, "http_client: '\''direct-http'\''") { count++ } END { print count + 0 }' "$generator")"
              test "$http_clients" -ge 3 || {
                echo "::error::HomeProxy rule-set bootstrap downloads do not use direct HTTP client" >&2
                exit 1
              }
              ! grep -Fq "download_detour:" "$generator" || {
                echo "::error::HomeProxy still contains deprecated rule-set download_detour for sing-box ${sing_box_version}" >&2
                exit 1
              }
            else
              direct_detours="$(awk 'index($0, "download_detour: '\''direct-out'\''") { count++ } END { print count + 0 }' "$generator")"
              test "$direct_detours" -ge 3 || {
                echo "::error::HomeProxy rule-set bootstrap downloads are not direct-out" >&2
                exit 1
              }
              ! grep -Fq "download_detour: 'main-out'" "$generator" || {
                echo "::error::HomeProxy rule-set bootstrap downloads still depend on main-out" >&2
                exit 1
              }
            fi
            grep -Fq "function is_placeholder_subscription_node(config)" "$updater" || {
              echo "::error::HomeProxy placeholder subscription node helper is missing" >&2
              exit 1
            }
            grep -Fq "Skipping placeholder subscription node" "$updater" || {
              echo "::error::HomeProxy placeholder subscription node check is missing" >&2
              exit 1
            }
            grep -Fq "No main node is selected, switching to the first node." "$updater" || {
              echo "::error::HomeProxy first subscription node fallback is missing" >&2
              exit 1
            }
            ! grep -Fq "match(proxy_mode), /tproxy/" "$generator" || {
              echo "::error::HomeProxy contains malformed tproxy match syntax" >&2
              exit 1
            }
            ! grep -Fq "match(proxy_mode), /tun/" "$generator" || {
              echo "::error::HomeProxy contains malformed tun match syntax" >&2
              exit 1
            }
            echo "OK: HomeProxy scripts patched for sing-box ${sing_box_version}, placeholder subscriptions, and first node fallback"
          }
          require_config CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01
          require_config CONFIG_TARGET_ROOTFS_SQUASHFS
          require_config CONFIG_IPQ_MEM_PROFILE_512
          require_config CONFIG_NSS_MEM_PROFILE_MEDIUM
          require_nss_firmware_version
          require_config CONFIG_PACKAGE_nss-firmware-ipq60xx
          require_config CONFIG_NSS_DRV_IGS_ENABLE
          require_config CONFIG_NSS_DRV_IPV6_ENABLE
          require_config CONFIG_NSS_DRV_L2TP_ENABLE
          require_config CONFIG_NSS_DRV_LAG_ENABLE
          require_config CONFIG_NSS_DRV_MAPT_ENABLE
          require_config CONFIG_NSS_DRV_PPPOE_ENABLE
          require_config CONFIG_NSS_DRV_PPTP_ENABLE
          require_config CONFIG_NSS_DRV_SHAPER_ENABLE
          require_config CONFIG_NSS_DRV_VIRT_IF_ENABLE
          require_config CONFIG_PACKAGE_cpufreq
          require_config CONFIG_PACKAGE_kmod-qca-nss-drv
          require_config CONFIG_PACKAGE_kmod-qca-nss-ecm
          require_config CONFIG_PACKAGE_kmod-qca-nss-drv-igs
          require_config CONFIG_PACKAGE_kmod-qca-nss-drv-l2tpv2
          require_config CONFIG_PACKAGE_kmod-qca-nss-drv-lag-mgr
          require_config CONFIG_PACKAGE_kmod-qca-nss-drv-map-t
          require_config CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe
          require_config CONFIG_PACKAGE_kmod-qca-nss-drv-pptp
          require_config CONFIG_PACKAGE_kmod-qca-nss-drv-qdisc
          require_config CONFIG_PACKAGE_kmod-qca-mcs
          require_config CONFIG_PACKAGE_ip-full
          require_config CONFIG_PACKAGE_luci-app-samba4
          require_config CONFIG_PACKAGE_samba4-server
          require_config CONFIG_PACKAGE_luci-app-zerotier
          require_config CONFIG_PACKAGE_uhttpd
          require_config CONFIG_PACKAGE_rpcd
          require_config CONFIG_PACKAGE_luci-app-diskman
          require_config CONFIG_PACKAGE_block-mount
          require_config CONFIG_PACKAGE_blockd
          require_config CONFIG_PACKAGE_automount
          test -n "${AURORA_TAG:-}" || {
            echo "::error::Aurora latest stable tag was not exported" >&2
            exit 1
          }
          test -n "${AURORA_COMMIT:-}" || {
            echo "::error::Aurora commit was not exported" >&2
            exit 1
          }
          test -f package/luci-theme-aurora/Makefile || {
            echo "::error::Aurora theme source was not injected" >&2
            exit 1
          }
          test ! -e package/luci-app-quickfile-go
          test ! -e package/quickfile-go
          forbid_config CONFIG_PACKAGE_luci-app-quickfile
          forbid_config CONFIG_PACKAGE_luci-app-quickfile-go
          forbid_config CONFIG_PACKAGE_quickfile
          forbid_config CONFIG_PACKAGE_quickfile-go
          forbid_config CONFIG_PACKAGE_luci-nginx
          forbid_config CONFIG_PACKAGE_luci-app-filemanager
          forbid_config CONFIG_PACKAGE_luci-app-statistics
          forbid_config CONFIG_PACKAGE_collectd
          forbid_config CONFIG_PACKAGE_collectd-mod-cpu
          forbid_config CONFIG_PACKAGE_collectd-mod-interface
          forbid_config CONFIG_PACKAGE_collectd-mod-memory
          forbid_config CONFIG_PACKAGE_collectd-mod-conntrack
          forbid_config CONFIG_PACKAGE_kmod-ath11k
          forbid_config CONFIG_PACKAGE_kmod-ath11k-ahb
          forbid_config CONFIG_PACKAGE_kmod-ath11k-pci
          forbid_config CONFIG_PACKAGE_ath11k-firmware-ipq6018
          forbid_config CONFIG_PACKAGE_kmod-cfg80211
          forbid_config CONFIG_PACKAGE_kmod-mac80211
          forbid_config CONFIG_PACKAGE_wpad-openssl
          forbid_config CONFIG_PACKAGE_hostapd-common
          forbid_config CONFIG_PACKAGE_ipq-wifi-jdcloud_re-ss-01
          forbid_config CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr
          forbid_config CONFIG_PACKAGE_luci
          forbid_config CONFIG_PACKAGE_luci-app-package-manager
          require_recipe_patch
          test -f feeds/luci/applications/luci-app-homeproxy/Makefile || {
            echo "::error::HomeProxy source was not injected at feeds/luci/applications/luci-app-homeproxy" >&2
            exit 1
          }
          test -L package/feeds/luci/luci-app-homeproxy || {
            echo "::error::HomeProxy feed package symlink is missing" >&2
            exit 1
          }
          grep -q '^LUCI_TITLE:=The modern ImmortalWrt proxy platform' feeds/luci/applications/luci-app-homeproxy/Makefile || {
            echo "::error::Unexpected HomeProxy Makefile after injection" >&2
            exit 1
          }
          grep -q '+sing-box' feeds/luci/applications/luci-app-homeproxy/Makefile || {
            echo "::error::HomeProxy no longer depends on sing-box" >&2
            exit 1
          }
          require_homeproxy_generator_patch
          test -n "${HOMEPROXY_COMMIT:-}" || {
            echo "::error::HomeProxy commit was not exported" >&2
            exit 1
          }
          test -n "${HOMEPROXY_SOURCE:-}" || {
            echo "::error::HomeProxy source type was not exported" >&2
            exit 1
          }
          test -n "${SING_BOX_VERSION:-}" || {
            echo "::error::sing-box latest stable version was not exported" >&2
            exit 1
          }
          grep -q "^PKG_VERSION:=${SING_BOX_VERSION}$" feeds/packages/net/sing-box/Makefile || {
            echo "::error::sing-box Makefile does not match latest stable ${SING_BOX_VERSION}" >&2
            exit 1
          }
          grep -q "^PKG_HASH:=${SING_BOX_SOURCE_SHA256}$" feeds/packages/net/sing-box/Makefile || {
            echo "::error::sing-box Makefile hash does not match downloaded stable source" >&2
            exit 1
          }
          test -f "dl/${SING_BOX_SOURCE_FILE}" || {
            echo "::error::cached sing-box source tarball is missing" >&2
            exit 1
          }
          echo "${SING_BOX_SOURCE_SHA256}  dl/${SING_BOX_SOURCE_FILE}" | sha256sum -c -
          require_config CONFIG_PACKAGE_luci-app-homeproxy
          require_config CONFIG_PACKAGE_sing-box
          require_config CONFIG_PACKAGE_kmod-nft-socket
          require_config CONFIG_PACKAGE_kmod-nft-tproxy
          forbid_config CONFIG_PACKAGE_dockerd
          forbid_config CONFIG_PACKAGE_dae
          forbid_config CONFIG_PACKAGE_daed
          forbid_config CONFIG_PACKAGE_luci-app-daede
          make download -j"$(nproc)"
          find dl -maxdepth 1 -type f -size -1024c -print -delete

      - name: Check build space before compile
        run: |
          df -hT
          du -sh "$OPENWRT_PATH" "$OPENWRT_PATH/dl" "$OPENWRT_PATH/.ccache" 2>/dev/null || true

      - name: Compile firmware
        id: compile
        run: |
          cd "$OPENWRT_PATH"
          unset VERSION
          ccache -M 2G || true
          ccache -z || true
          if make -j"$(nproc)"; then
            echo "Parallel build succeeded"
          elif make -j1 V=s; then
            echo "Single-threaded retry succeeded"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          ccache -s || true
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "FILE_DATE=${FILE_DATE}" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
          echo "DATE=$(date '+%Y-%m-%d %H:%M:%S')" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"

      - name: Organize firmware
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd "$OPENWRT_PATH/bin/targets"/*/*
          ls -lh
          test -f ./*jdcloud_re-ss-01*squashfs-sysupgrade*
          cat sha256sums
          VARIANT="${{ matrix.variant }}"
          for f in *jdcloud_re-ss-01*squashfs-sysupgrade*; do
            [ -f "$f" ] && mv "$f" "JDC-AX1800-Pro-LiBwrt-${FILE_DATE}-${VARIANT}-sysupgrade.bin"
          done
          sha256sum "JDC-AX1800-Pro-LiBwrt-${FILE_DATE}-${VARIANT}-sysupgrade.bin" > "sha256sums-${VARIANT}"
          {
            echo "Builder repository: ${GITHUB_REPOSITORY}"
            echo "Builder commit: ${GITHUB_SHA}"
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Build date: ${DATE}"
            echo "Build version: ${FIRMWARE_VERSION}"
            echo "Source repository: ${REPO_URL}"
            echo "Source branch: ${REPO_BRANCH}"
            echo "Source commit: ${SOURCE_COMMIT}"
            echo "Kernel: ${VERSION_KERNEL}"
            echo "Variant: ${VARIANT}"
            echo "Final .config SHA256: $(sha256sum "${OPENWRT_PATH}/.config" | awk '{print $1}')"
            echo "core.config SHA256: $(sha256sum "${GITHUB_WORKSPACE}/configs/core.config" | awk '{print $1}')"
            echo "DIY script SHA256: $(sha256sum "${GITHUB_WORKSPACE}/scripts/diy.sh" | awk '{print $1}')"
            echo "NSS firmware version: ${NSS_FIRMWARE_VERSION:-unknown}"
            echo "Aurora tag: ${AURORA_TAG:-unknown}"
            echo "Aurora commit: ${AURORA_COMMIT:-unknown}"
            echo "HomeProxy source: ${HOMEPROXY_SOURCE:-not-included}"
            echo "HomeProxy tag: ${HOMEPROXY_TAG:-not-included}"
            echo "HomeProxy commit: ${HOMEPROXY_COMMIT:-not-included}"
            echo "HomeProxy ref: ${HOMEPROXY_REF:-not-included}"
            echo "sing-box feed version: ${SING_BOX_FEED_VERSION:-not-included}"
            echo "sing-box selected stable: ${SING_BOX_TAG:-not-included}"
            echo "sing-box source file: ${SING_BOX_SOURCE_FILE:-not-included}"
            echo "sing-box source SHA256: ${SING_BOX_SOURCE_SHA256:-not-included}"
            echo "sing-box required Go: ${SING_BOX_GO_VERSION:-not-included}"
            echo "OpenWrt feed Go: ${OPENWRT_GO_VERSION:-not-included}"
            echo
            echo "Firmware SHA256:"
            cat "sha256sums-${VARIANT}"
          } > "BUILD-MANIFEST-${VARIANT}.txt"
          build_info_files=("BUILD-MANIFEST-${VARIANT}.txt")
          for f in config.buildinfo feeds.buildinfo version.buildinfo profiles.json *.manifest; do
            [ -e "$f" ] && build_info_files+=("$f")
          done
          tar -czf "build-info-${FILE_DATE}-${VARIANT}.tar.gz" "${build_info_files[@]}"
          echo "FIRMWARE_PATH=$PWD" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: firmware-${{ matrix.variant }}
          path: |
            ${{ steps.organize.outputs.FIRMWARE_PATH }}/*-sysupgrade.bin
            ${{ steps.organize.outputs.FIRMWARE_PATH }}/sha256sums-${{ matrix.variant }}
            ${{ steps.organize.outputs.FIRMWARE_PATH }}/BUILD-MANIFEST-${{ matrix.variant }}.txt
            ${{ steps.organize.outputs.FIRMWARE_PATH }}/build-info-${{ needs.metadata.outputs.file_date }}-${{ matrix.variant }}.tar.gz

  release:
    name: Publish firmware release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    permissions:
      contents: write
    env:
      FILE_DATE: ${{ needs.metadata.outputs.file_date }}
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Prepare release body
        run: |
          cd firmware
          test -f BUILD-MANIFEST-core.txt
          test -f "JDC-AX1800-Pro-LiBwrt-${FILE_DATE}-core-sysupgrade.bin"
          cat sha256sums-* > sha256sums
          sha256sum -c sha256sums

          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          kernel="$(awk -F': ' '/^Kernel:/{print $2; exit}' BUILD-MANIFEST-*.txt)"
          source_commit="$(awk -F': ' '/^Source commit:/{print $2; exit}' BUILD-MANIFEST-*.txt)"
          build_version="$(awk -F': ' '/^Build version:/{print $2; exit}' BUILD-MANIFEST-*.txt)"

          {
            echo "## 下载"
            echo
            echo "| 变体 | 适用场景 | sysupgrade |"
            echo "|:---|:---|:---|"
            sysupgrade="JDC-AX1800-Pro-LiBwrt-${FILE_DATE}-core-sysupgrade.bin"
            printf '| `%s` | %s | [%s](%s/%s) |\n' "core" "日用主路由" "sysupgrade" "$release_url" "$sysupgrade"
            echo
            echo "> 本项目只发布经过 OpenWrt/LiBwrt sysupgrade 路径使用的 sysupgrade 镜像。"
            echo
            echo "## 构建信息"
            echo
            echo "- 日期: ${FILE_DATE}"
            echo "- 内核: ${kernel:-unknown}"
            echo "- 固件版本: ${build_version:-unknown}"
            echo "- 上游: LiBwrt 25.12-nss @ ${source_commit:-unknown}"
            echo "- 构建记录: ${run_url}"
            echo
            echo "校验和见 \`sha256sums\`，完整追溯信息见 \`BUILD-MANIFEST-*.txt\` 和 \`build-info-*.tar.gz\`。"
          } > RELEASE.md

      - name: Publish release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          name: JDC AX1800 Pro LiBwrt · ${{ needs.metadata.outputs.file_date }}
          tag: ${{ needs.metadata.outputs.release_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: firmware/*-sysupgrade.bin,firmware/sha256sums,firmware/BUILD-MANIFEST-*.txt,firmware/build-info-*.tar.gz
          bodyFile: firmware/RELEASE.md
          commit: ${{ github.sha }}
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true

      - name: Align release tag with builder commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
            -f sha="${GITHUB_SHA}" \
            -F force=true
